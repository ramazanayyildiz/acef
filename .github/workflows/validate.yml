name: validate

on:
  push:
  pull_request:

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python tests (scripts/test-acef-* with a python3 shebang)
        run: |
          n=0
          for f in scripts/test-acef-*; do
            head -1 "$f" | grep -q python || continue
            echo "== $f =="
            python3 -I "$f"
            n=$((n+1))
          done
          test "$n" -gt 0
      - name: Run full test suite (all scripts/test-acef-*, Node)
        run: |
          for f in scripts/test-acef-*; do
            head -1 "$f" | grep -q python && continue   # Python tests run in the step above
            echo "== $f =="
            node "$f"
          done
      - name: Installer tests (scripts/test-install-acef-*)
        run: |
          n=0
          for f in scripts/test-install-acef-*; do
            echo "== $f =="
            node "$f"
            n=$((n+1))
          done
          test "$n" -gt 0
      - name: closeout verify — integration check (cli delivery fixture)
        run: node tests/fixtures/closeout-delivery/run.js
